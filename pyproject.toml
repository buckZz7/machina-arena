[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "machina-arena"
version = "0.1.0"
description = "Open robotics policy competition platform"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gymnasium",
]

[project.optional-dependencies]
maniskill = ["mani-skill"]
dev = ["pytest", "imageio"]

[tool.setuptools.packages.find]
include = ["machina_arena*"]
